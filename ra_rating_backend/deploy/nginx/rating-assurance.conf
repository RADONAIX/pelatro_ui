# RADONaix — Rating Assurance service: nginx snippet.
#
# Paste the `upstream` block and the `location /api/rating/` block into the
# EXISTING ra_backend/deploy/nginx/radonaix.conf. Nothing in that file needs to
# change: nginx picks the longest matching prefix, so `/api/rating/` wins over
# `/api/` and every existing route keeps going to the current backend.
#
#   https://<host>/api/...         -> ra_backend        (127.0.0.1:8000)  unchanged
#   https://<host>/api/rating/...  -> ra_rating_backend (127.0.0.1:8010)  new

upstream radonaix_rating_api {
    server 127.0.0.1:8010;   # Docker: change to  server rating-api:8010;
}

# --- Place this ABOVE the existing `location /api/` block -------------------
location /api/rating/ {
    proxy_pass http://radonaix_rating_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;

    # Rule compilation (Phase 2) and rating runs (Phase 3+) are long-running.
    # The default 60s would cut a large publish off mid-flight.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Bulk rule imports (Phase 5) upload multi-MB vendor config packages.
    client_max_body_size 64m;
}
